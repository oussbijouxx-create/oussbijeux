<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oussbijeux | مجوهرات بالجملة</title>
<meta name="theme-color" content="#6B1530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--cream:#FAF3E6;--paper:#FFFBF2;--burg:#6B1530;--burg2:#4A0E22;--gold:#C09A3E;--gold2:#E2C675;--ink:#2B1620;--mut:#8A6F73}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding-bottom:90px}
header{background:var(--burg);color:var(--cream);text-align:center;padding:28px 16px 22px;border-bottom:4px solid var(--gold)}
header h1{font-family:Amiri,serif;font-size:2.6rem;color:var(--gold2);letter-spacing:.04em;line-height:1.1}
header p{margin-top:6px;font-size:.95rem;opacity:.9}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--gold);background:transparent;color:var(--burg);padding:7px 16px;border-radius:99px;font:500 .95rem Tajawal;cursor:pointer}
.chip.on{background:var(--burg);color:var(--gold2);border-color:var(--burg)}
.banner{margin:12px 14px 0;background:var(--paper);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;color:var(--burg);font-weight:500;display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr);max-width:1200px;margin:auto}}
.card{position:relative;background:var(--paper);border:1px solid #E8D9B5;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.card.sel{border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(192,154,62,.25)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#efe3c8}
.card .info{padding:10px 12px 12px}
.card .nm{font-weight:700;font-size:.98rem}
.card .pr{color:var(--burg);font-family:Amiri,serif;font-size:1.1rem;margin-top:2px}
.tick{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,251,242,.9);border:1.5px solid var(--gold);display:grid;place-items:center;color:#fff;font-weight:700}
.card.sel .tick{background:var(--burg);border-color:var(--burg)}
.new{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--burg2);font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px}
.out{position:absolute;inset:0;background:rgba(250,243,230,.7);display:grid;place-items:center;font-weight:700;color:var(--burg)}
.empty{text-align:center;color:var(--mut);padding:60px 20px;grid-column:1/-1}
.bar{position:fixed;bottom:0;left:0;right:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:var(--burg2);border-top:2px solid var(--gold);display:none;z-index:5}
.btn{width:100%;border:0;border-radius:10px;padding:14px;font:700 1.05rem Tajawal;background:var(--gold);color:var(--burg2);cursor:pointer}
.btn.alt{background:transparent;border:1px solid var(--gold);color:var(--burg)}
.btn.sm{width:auto;padding:8px 14px;font-size:.9rem}
.modal{position:fixed;inset:0;background:rgba(43,22,32,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.show{display:flex}
.sheet{background:var(--paper);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:22px;max-height:90vh;overflow:auto}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-family:Amiri,serif;color:var(--burg);margin-bottom:12px}
label{display:block;margin:10px 0 4px;font-weight:500;font-size:.92rem}
input,textarea{width:100%;padding:11px;border:1px solid #D9C592;border-radius:8px;font:inherit;background:#fff}
.sum{font-size:.9rem;color:var(--mut);margin-bottom:6px}
.row{display:flex;gap:8px;margin-top:14px}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:20px}
footer a{color:var(--burg);cursor:pointer;text-decoration:underline}
.adm{display:none;margin:14px;background:var(--paper);border:1px dashed var(--gold);border-radius:12px;padding:14px}
.adm.show{display:block}
.acts{display:flex;gap:6px;padding:0 12px 12px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--burg);color:var(--cream);padding:10px 18px;border-radius:10px;z-index:20;display:none}
</style>
</head>
<body>
<header>
  <h1>oussbijeux</h1>
  <p>مجوهرات راقية · البيع بالجملة</p>
</header>

<div class="banner" id="banner"></div>
<div class="chips" id="chips"></div>

<section class="adm" id="adm">
  <h2 style="font-family:Amiri;color:var(--burg)">لوحة المدير: إضافة منتج</h2>
  <label>صور المنتج (يمكن اختيار عدة صور، كل صورة تصبح منتجًا)</label>
  <input type="file" id="f_img" accept="image/*" multiple>
  <label>الاسم (اختياري، يُطبّق على الكل)</label><input id="f_name" placeholder="مثال: سوار ذهبي">
  <label>السعر بالجملة (دج)</label><input id="f_price" type="number" inputmode="numeric">
  <label>الصنف</label><input id="f_cat" placeholder="أساور، خواتم، أقراط...">
  <div class="row"><button class="btn" id="f_add">نشر المنتجات</button></div>
  <label style="margin-top:16px">رقم واتساب لاستلام الطلبات (بصيغة 213...)</label>
  <div class="row" style="margin-top:0"><input id="f_wa" inputmode="numeric"><button class="btn sm" id="f_wa_save">حفظ</button></div>
  <div class="row"><button class="btn alt sm" id="f_out">تسجيل الخروج</button></div>
</section>

<main class="grid" id="grid"></main>
<footer>© oussbijeux<a id="adminLink" style="display:none"></a></footer>

<div class="bar" id="bar"><button class="btn" id="sendOpen"></button></div>

<div class="modal" id="mSend"><div class="sheet">
  <h2>أكمل طلبك</h2>
  <div class="sum" id="sum"></div>
  <label>اسمك</label><input id="c_name" autocomplete="name">
  <label>العنوان (الولاية، البلدية، الشارع)</label><textarea id="c_addr" rows="2"></textarea>
  <button class="btn alt sm" id="c_loc" type="button" style="margin-top:8px">📍 أو أرسل موقعي على الخريطة</button>
  <div class="sum" id="c_locst" style="margin-top:6px"></div>
  <label>ملاحظة (الكمية، المدينة...) اختياري</label><textarea id="c_note" rows="2"></textarea>
  <div class="row"><button class="btn" id="goWa">إرسال إلى واتساب</button><button class="btn alt sm" data-close>إلغاء</button></div>
</div></div>

<div class="modal" id="mLogin"><div class="sheet">
  <h2>دخول المدير</h2>
  <label>البريد الإلكتروني</label><input id="l_mail" type="email" autocomplete="email">
  <label>كلمة المرور</label><input id="l_pass" type="password" autocomplete="current-password">
  <div class="row"><button class="btn" id="l_go">دخول</button><button class="btn alt sm" data-close>إلغاء</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://zvroaaksrngquqnmlewp.supabase.co";
const SUPABASE_KEY = "sb_publishable_7eKyxPhcAwLFuF9FVyQMYA_U7D0JSxY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const orderIds = (new URLSearchParams(location.search).get("order") || "").split(",").filter(Boolean);
let products = [], sel = new Set(), cat = "الكل", isAdmin = false, waNumber = "213795882624";
const LS = "oussbijeux_lastseen";
let lastSeen = 0; try { lastSeen = +localStorage.getItem(LS) || 0; } catch (e) {}

function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; setTimeout(() => el.style.display = "none", 2600); }
const fmt = p => p ? Number(p).toLocaleString("ar-DZ") + " دج" : "";

async function load() {
  const { data, error } = await sb.from("products").select("*").order("created_at", { ascending: false });
  if (error) { $("grid").innerHTML = '<div class="empty">تعذر تحميل المنتجات، حاول لاحقًا.</div>'; return; }
  products = data;
  const { data: s } = await sb.from("settings").select("whatsapp").eq("id", 1).maybeSingle();
  if (s && s.whatsapp) waNumber = s.whatsapp;
  $("f_wa").value = waNumber;
  const fresh = products.filter(p => new Date(p.created_at).getTime() > lastSeen);
  if (lastSeen && fresh.length) { $("banner").style.display = "block"; $("banner").textContent = "وصل جديد: " + fresh.length + " منتجات منذ زيارتك الأخيرة"; }
  if (orderIds.length) { $("banner").style.display = "block"; $("banner").innerHTML = 'صور الطلب · <a href="/" style="color:var(--burg)">عرض كل المنتجات</a>'; }
  render();
  try { localStorage.setItem(LS, Date.now()); } catch (e) {}
}

function render() {
  const cats = ["الكل", ...new Set(products.map(p => p.category).filter(Boolean))];
  $("chips").innerHTML = cats.map(c => `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  const list = orderIds.length ? products.filter(p => orderIds.includes(p.id)) : products.filter(p => cat === "الكل" || p.category === cat);
  if (!list.length) { $("grid").innerHTML = '<div class="empty">لا توجد منتجات حاليًا، عُد قريبًا.</div>'; updateBar(); return; }
  $("grid").innerHTML = list.map(p => {
    const isNew = Date.now() - new Date(p.created_at).getTime() < 7 * 864e5;
    return `<div class="card ${sel.has(p.id) ? "sel" : ""}" data-id="${p.id}">
      <img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">
      <div class="tick">${sel.has(p.id) ? "✓" : ""}</div>
      ${isNew ? '<div class="new">جديد</div>' : ""}
      ${p.in_stock === false ? '<div class="out">غير متوفر</div>' : ""}
      <div class="info"><div class="nm">${esc(p.name)}</div><div class="pr">${fmt(p.price)}</div></div>
      ${isAdmin ? `<div class="acts"><button class="btn alt sm" data-stock="${p.id}">${p.in_stock === false ? "متوفر" : "نفد"}</button><button class="btn alt sm" data-del="${p.id}">حذف</button></div>` : ""}
    </div>`;
  }).join("");
  updateBar();
}

function updateBar() {
  $("bar").style.display = sel.size ? "block" : "none";
  $("sendOpen").textContent = "تفاوض عبر واتساب (" + sel.size + " منتجات)";
}

$("chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; render(); } };
$("grid").onclick = async e => {
  const st = e.target.closest("[data-stock]"), dl = e.target.closest("[data-del]");
  if (st) { const p = products.find(x => x.id === st.dataset.stock); await sb.from("products").update({ in_stock: p.in_stock === false }).eq("id", p.id); return load(); }
  if (dl) { if (!confirm("حذف هذا المنتج؟")) return; await sb.from("products").delete().eq("id", dl.dataset.del); return load(); }
  const c = e.target.closest(".card"); if (!c) return;
  const p = products.find(x => x.id === c.dataset.id); if (!p || p.in_stock === false) return;
  sel.has(p.id) ? sel.delete(p.id) : sel.add(p.id); render();
};

$("sendOpen").onclick = () => {
  const items = products.filter(p => sel.has(p.id));
  $("sum").textContent = items.map(p => p.name).join("، ");
  $("mSend").classList.add("show");
};
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => document.querySelectorAll(".modal").forEach(m => m.classList.remove("show")));

let locLink = "";
$("c_loc").onclick = () => {
  if (!navigator.geolocation) { toast("متصفحك لا يدعم تحديد الموقع"); return; }
  $("c_locst").textContent = "جارٍ تحديد موقعك...";
  navigator.geolocation.getCurrentPosition(
    p => { locLink = "https://www.google.com/maps?q=" + p.coords.latitude.toFixed(6) + "," + p.coords.longitude.toFixed(6); $("c_locst").textContent = "✓ تم تحديد موقعك"; },
    () => { $("c_locst").textContent = "تعذر تحديد الموقع، اكتب عنوانك يدويًا."; },
    { enableHighAccuracy: true, timeout: 12000 }
  );
};
$("goWa").onclick = () => {
  const name = $("c_name").value.trim();
  const addr = $("c_addr").value.trim();
  if (!name) { toast("اكتب اسمك أولًا"); return; }
  if (!addr && !locLink) { toast("اكتب عنوانك أو أرسل موقعك على الخريطة"); return; }
  const items = products.filter(p => sel.has(p.id));
  let msg = "السلام عليكم، أنا " + name + ".\n";
  if (addr) msg += "العنوان: " + addr + "\n";
  if (locLink) msg += "الموقع على الخريطة: " + locLink + "\n";
  msg += "أرغب في التفاوض على هذه المنتجات (بالجملة):\n\n";
  items.forEach((p, i) => { msg += (i + 1) + ". " + p.name + (p.price ? " - " + fmt(p.price) : "") + "\n"; });
  msg += "\nصور الطلب (رابط واحد):\n" + location.origin + "/?order=" + items.map(p => p.id).join(",") + "\n";
  const note = $("c_note").value.trim(); if (note) msg += "\nملاحظة: " + note;
  window.open("https://wa.me/" + waNumber + "?text=" + encodeURIComponent(msg), "_blank");
};

/* ---- Admin ---- */
function openAdminFromHash() {
  if (location.hash === "#admin-oussbijeux" && !isAdmin) $("mLogin").classList.add("show");
}
window.addEventListener("hashchange", openAdminFromHash);
setTimeout(openAdminFromHash, 600);
$("l_go").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("l_mail").value.trim(), password: $("l_pass").value });
  if (error) { toast("البريد أو كلمة المرور غير صحيحة"); return; }
  $("mLogin").classList.remove("show"); checkAdmin();
};
$("f_out").onclick = async () => { await sb.auth.signOut(); checkAdmin(); };
async function checkAdmin() {
  const { data } = await sb.auth.getSession();
  isAdmin = !!data.session; $("adm").classList.toggle("show", isAdmin); render();
}
function shrink(file, max = 1200) {
  return new Promise(res => {
    const fallback = () => res(file);
    const timer = setTimeout(fallback, 8000);
    const img = new Image();
    img.onerror = () => { clearTimeout(timer); fallback(); };
    img.onload = () => {
      try {
        const r = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = img.width * r; c.height = img.height * r; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => { clearTimeout(timer); res(b || file); }, "image/jpeg", 0.85);
      } catch (e) { clearTimeout(timer); fallback(); }
    };
    img.src = URL.createObjectURL(file);
  });
}
const withTimeout = (p, ms, msg) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
$("f_add").onclick = async () => {
  const files = [...$("f_img").files]; if (!files.length) { toast("اختر صورة واحدة على الأقل"); return; }
  $("f_add").disabled = true; $("f_add").textContent = "جارٍ الرفع...";
  try {
    for (const [i, f] of files.entries()) {
      const blob = await shrink(f), path = Date.now() + "_" + i + ".jpg";
      const up = await withTimeout(sb.storage.from("products").upload(path, blob, { contentType: blob.type || "image/jpeg", upsert: true }), 40000, "انتهت مهلة الرفع، تحقق من الإنترنت ومن مخزن الصور products في Supabase");
      if (up.error) throw up.error;
      const url = sb.storage.from("products").getPublicUrl(path).data.publicUrl;
      const ins = await sb.from("products").insert({ name: $("f_name").value.trim() || "منتج جديد", price: $("f_price").value || null, category: $("f_cat").value.trim() || null, image_url: url });
      if (ins.error) throw ins.error;
    }
    toast("تم النشر"); $("f_img").value = ""; $("f_name").value = ""; load();
  } catch (e) { toast("فشل الرفع: " + (e.message || "خطأ")); }
  $("f_add").disabled = false; $("f_add").textContent = "نشر المنتجات";
};
$("f_wa_save").onclick = async () => {
  let n = $("f_wa").value.replace(/\D/g, ""); if (n.startsWith("0")) n = "213" + n.slice(1);
  const { error } = await sb.from("settings").upsert({ id: 1, whatsapp: n });
  if (error) toast("تعذر الحفظ"); else { waNumber = n; $("f_wa").value = n; toast("تم حفظ الرقم"); }
};

checkAdmin(); load();
</script>
</body>
</html>
